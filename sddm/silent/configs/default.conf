; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 1.5
enable-animations = true
animated-background-placeholder = wallpaper.mp4
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "current-wallpaper.png"
use-background-color = false
background-color = "#000000"
blur = 0
brightness = 0.0
saturation = 0.0

[LockScreen.Clock]
display = true
position = "center"
align = "center"
format = "hh:mm"
font-family = "JetBrainsMono Nerd Font"
font-size = 80
font-weight = 900
color = "#ffffff"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "JetBrainsMono Nerd Font"
font-size = 25
font-weight = 600
color = "#ffffff"
margin-top = -15

[LockScreen.Message]
display = false
position = "bottom-center"
align = "center"
text = "Press any key"
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#ffffff"
paint-icon = true
spacing = 0

[LoginScreen]
background = "current-wallpaper.png"
use-background-color = false
background-color = "#ffffff"
blur = 32
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 30
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 0
inactive-border-size = 0
active-border-color = "#ffffff"
inactive-border-color = "#ffffff"

[LoginScreen.LoginArea.Username]
font-family = "JetBrainsMono Nerd Font"
font-size = 16
font-weight = 700
color = "#ffffff"
margin = 10

; Caelestia lock screen palette (m3surfaceContainer / m3onSurface)
[LoginScreen.LoginArea.PasswordInput]
width = 280
height = 32
display-icon = true
font-family = "JetBrainsMono Nerd Font"
font-size = 12
icon = "fingerprint.svg"
icon-size = 16
content-color = "#313428"
background-color = "#f5f6e7"
background-opacity = 0.92
border-size = 0
border-color = "#ffffff"
border-radius-left = 15
border-radius-right = 15
margin-top = 10
masked-character = "●"

; active-background/content colours double as the caelestia enter button
; (m3primary / m3onPrimary)
[LoginScreen.LoginArea.LoginButton]
background-color = "#ffffff"
background-opacity = 0.0
active-background-color = "#54652e"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#ffffff"
active-content-color = "#f1ffcb"
border-size = 2
border-color = "#ffffff"
border-radius-left = 10
border-radius-right = 10
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = true
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = false
text = "Logging in"
font-family = "JetBrainsMono Nerd Font"
font-weight = 600
font-size = 24
icon-size = 24
icon = "spinner.svg"
color = "#ffffff"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "JetBrainsMono Nerd Font"
font-size = 11
font-weight = 400
normal-color = "#ffffff"
warning-color = "#fee7a1"
error-color = "#fd795a"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 64
margin-right = 64
margin-bottom = 64
margin-left = 64
size = 30
border-radius = 5
spacing = 10
font-family = "JetBrainsMono Nerd Font"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = false
margin = 5
background-color = "#000000"
background-opacity = 1.0
active-option-background-color = "#c3c6fb"
active-option-background-opacity = 1.0
content-color = "#c3c6fb"
active-content-color = "#000000"
font-family = "JetBrainsMono Nerd Font"
border-size = 2
border-color = "#c3c6fb"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = false
position = "bottom-left"
index = 4
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 100
popup-width = 200
background-color = "#c3c6fb"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#ffffff"
active-content-color = "#000000"
border-size = 0
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = false
position = "bottom-left"
index = 3
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "#ffffff"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#ffffff"
active-content-color = "#000000"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = false
position = "bottom-left"
index = 2
background-color = "#ffffff"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#ffffff"
active-content-color = "#000000"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = false
position = "bottom-right"
index = 1
popup-direction = "up"
popup-align = "end"
popup-width = 100
background-color = "#ffffff"
background-opacity = 0.0
active-background-opacity = 1.0
content-color = "#ffffff"
active-content-color = "#000000"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#000000"
background-opacity = 1.0
key-content-color = "#ffffff"
key-color = "#000000"
key-opacity = 1.0
key-active-background-color = "#000000"
key-active-opacity = 0.0
selection-background-color = "#303030"
selection-content-color = "#ffffff"
primary-color = "#8c90c2"
border-size = 2
border-color = "#ffffff"

[Tooltips]
enable = false
font-family = "JetBrainsMono Nerd Font"
font-size = 11
content-color = "#ffffff"
background-color = "#000000"
background-opacity = 1.0
border-radius = 5
disable-user = false
disable-login-button = false
