###################
### KEYBINDINGS ###
###################

$terminal = kitty
$fileManager = nautilus
$menu = pkill wofi || wofi --conf ~/.config/wofi/config/config --style ~/.config/wofi/src/mocha/style.css
$mainMod = SUPER

# GENERAL
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, space, exec, pkill $menu || $menu --show drun # App launcher
bind = $mainMod, Q, killactive

# APPS
bind = ALT, E, exec, $fileManager
bind = $mainMod SHIFT, RETURN, exec, chromium --enable-features=UseOzonePlatform --ozone-platform=wayland # Browser
bind = $mainMod SHIFT, O, exec, obsidian

# UTILS
bind = $mainMod ALT, L, exec, hyprlock # Lock screen
bind = $mainMod SHIFT, N, exec, swaync-client -t # Notification center
bind = $mainMod SHIFT, P, exec, hyprpicker -a -l

## Screenshot
bind = ALT SHIFT, W, exec, hyprshot -m window output --clipboard-only
bind = ALT SHIFT, S, exec, hyprshot -m region output --clipboard-only
bind = , PRINT, exec, hyprshot -m window
bind = $mainMod, PRINT, exec, hyprshot -m region

## Alt-tab
bind = $mainMod, Tab, exec, snappy-switcher next
bind = $mainMod SHIFT, Tab, exec, snappy-switcher prev

## Clipboard
windowrule = match:class clipse, float true
windowrule = match:class clipse, size 960 600
bindd = $mainMod, C, Universal copy, sendshortcut, CTRL, Insert,
bindd = $mainMod, V, Universal paste, sendshortcut, SHIFT, Insert,
bindd = $mainMod, X, Universal cut, sendshortcut, CTRL, X,
bind = SUPER SHIFT, V, exec, kitty --class clipse -e clipse

## Network Manager
windowrule = match:class gazelle, float true
windowrule = match:class gazelle, maximize true
bind = SUPER SHIFT, W, exec, pkill gazelle || kitty --class gazelle -e gazelle

## Preview files in nautilus with sushi
windowrule = match:class org.gnome.NautilusPreviewer, float true
windowrule = match:class org.gnome.NautilusPreviewer, maximize true

# WINDOWS
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

bind = $mainMod, Equal, resizeactive, 80 0
bind = $mainMod, Minus, resizeactive, -80 0
bind = $mainMod SHIFT, Equal, resizeactive, 0 -80
bind = $mainMod SHIFT, Minus, resizeactive, 0 80

bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod SHIFT, T, layoutmsg, togglesplit

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# MULTIMEDIA & BRIGHTNESS
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# LID SWITCH
bindl = , switch:on:Lid Switch, exec, systemctl suspend
