#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 2
    gaps_out = 4

    border_size = 2

    col.active_border = rgb(125,196,228)

    allow_tearing = true

    layout = dwindle
}

decoration {
    rounding = 4
    # rounding_power = 8

    blur {
        enabled = true
        size = 4
        passes = 0
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint, popin 0%
    animation = windowsIn,     1,     4.1,   easeOutQuint
    animation = windowsOut,    1,     1.49,  linear
    animation = fadeIn,        1,     1.73,  easeOutQuint
    animation = fadeOut,       1,     1.46,  easeOutQuint
    animation = fade,          1,     3.03,  easeOutQuint
    animation = layers,        1,     3.81,  easeOutQuint, slide
    animation = layersIn,      1,     4,     easeOutQuint, slide
    animation = layersOut,     1,     1.5,   linear,       slide
    animation = fadeLayersIn,  1,     1.79,  easeOutQuint
    animation = fadeLayersOut, 1,     1.39,  easeOutQuint
    animation = workspaces,    1,     1.94,  almostLinear, slide
    animation = workspacesIn,  1,     1.21,  almostLinear
    animation = workspacesOut, 1,     1.94,  almostLinear
    animation = zoomFactor,    1,     7,     easeOutQuint
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    vfr = true
}



